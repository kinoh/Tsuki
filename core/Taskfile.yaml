version: '3'

dotenv: ['../.env', './.env']

env:
  DOCKER_HOST: ""

vars:
  DOCKER_COMPOSE: docker compose -f ../compose.test.yaml

tasks:
  serve:
    desc: Run core-rust locally with core-rust/.env
    cmds:
      - cargo run --bin tsuki-core-rust

  embedding/download-model:
    desc: Download the local concept embedding model used by core
    vars:
      MODEL_DIR: '{{.CONCEPT_EMBEDDING_MODEL_DIR | default "/opt/tsuki/models/quantized-stable-static-embedding-fast-retrieval-mrl-ja"}}'
      MODEL_BASE_URL: https://huggingface.co/RikkaBotan/quantized-stable-static-embedding-fast-retrieval-mrl-ja/resolve/e092037cf8c85a3f1325bfa22d2797f3bc13594e
    cmds:
      - |
        set -eux
        echo "embedding model download start: {{.MODEL_DIR}}"
        mkdir -p "{{.MODEL_DIR}}"
        wget -O "{{.MODEL_DIR}}/tokenizer.json" "{{.MODEL_BASE_URL}}/tokenizer.json"
        wget -O "{{.MODEL_DIR}}/model_rest.safetensors" "{{.MODEL_BASE_URL}}/model_rest.safetensors"
        wget -O "{{.MODEL_DIR}}/embedding.q4_k_m.bin" "{{.MODEL_BASE_URL}}/embedding.q4_k_m.bin"
        test -s "{{.MODEL_DIR}}/tokenizer.json"
        test -s "{{.MODEL_DIR}}/model_rest.safetensors"
        test -s "{{.MODEL_DIR}}/embedding.q4_k_m.bin"
        echo "embedding model download complete: {{.MODEL_DIR}}"

  integration/memgraph/up:
    desc: Start isolated test memgraph service
    cmds:
      - '{{.DOCKER_COMPOSE}} up -d memgraph-test'

  integration/memgraph/down:
    desc: Stop isolated test memgraph service
    cmds:
      - '{{.DOCKER_COMPOSE}} stop memgraph-test'

  integration/memgraph/restore/latest:
    desc: Restore latest memgraph snapshot into isolated test memgraph
    vars:
      BACKUP_FILE_NAME:
        sh: 'ls -t ${BACKUP_DIR:-../backup/memgraph} | head -1'
    cmds:
      - task integration/memgraph/restore/{{.BACKUP_FILE_NAME}}

  integration/memgraph/restore/*:
    desc: Restore memgraph snapshot into isolated test memgraph
    vars:
      BACKUP_DIR: ${BACKUP_DIR:-../backup/memgraph}
      BACKUP_FILE_NAME: '{{index .MATCH 0}}'
    deps:
      - integration/memgraph/up
    cmds:
      - '{{.DOCKER_COMPOSE}} exec -u root memgraph-test mkdir -p /data/snapshots'
      - '{{.DOCKER_COMPOSE}} cp {{.BACKUP_DIR}}/{{.BACKUP_FILE_NAME}} memgraph-test:/data/snapshots/{{.BACKUP_FILE_NAME}}'
      - '{{.DOCKER_COMPOSE}} exec -u root memgraph-test chown memgraph:memgraph /data/snapshots/{{.BACKUP_FILE_NAME}}'
      - 'echo "RECOVER SNAPSHOT ''/data/snapshots/{{.BACKUP_FILE_NAME}}'' FORCE;" | {{.DOCKER_COMPOSE}} exec -T memgraph-test mgconsole'

  integration/memgraph/wait:
    desc: Wait until isolated test memgraph can answer queries
    cmds:
      - |
        for i in $(seq 1 60); do
          if echo "RETURN 1;" | {{.DOCKER_COMPOSE}} exec -T memgraph-test mgconsole >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "memgraph-test did not become ready in time" >&2
        exit 1

  integration/prepare:
    desc: Prepare integration test runtime prerequisites
    deps:
      - integration/memgraph/restore/latest
    cmds:
      - task integration/memgraph/wait
      - mkdir -p tests/integration/logs tests/integration/results

  integration/run:
    desc: Prepare environment and run integration harness
    deps:
      - integration/prepare
    cmds:
      - cargo run --example integration_harness -- {{.CLI_ARGS}}
