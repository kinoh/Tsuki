openapi: 3.0.3
info:
  title: Tsuki Core-Rust HTTP API
  version: 1.3.0
  description: |
    HTTP contract for the current core phase.
    Includes runtime APIs, notification APIs, and TTS synthesis API.

servers:
  - url: http://localhost:2953

tags:
  - name: History
  - name: Runtime
  - name: Notification
  - name: Speech
  - name: Improvement
  - name: Admin

paths:
  /events:
    get:
      tags: [History]
      summary: List runtime events
      operationId: listEvents
      security:
        - UserTokenAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Max number of events.
        - name: before_ts
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return events strictly older than this timestamp.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order by `(ts, event_id)`.
        - name: tags
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            Optional OR filter by event tags.
            Repeat the query key for multiple tags
            (e.g. `?tags=input&tags=response`).
            Events tagged `debug` are excluded unless `tags=debug` is explicitly provided.
      responses:
        '200':
          description: Event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /metadata:
    get:
      tags: [Runtime]
      summary: Get runtime metadata
      operationId: getMetadata
      security:
        - UserTokenAuth: []
      responses:
        '200':
          description: Runtime metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /config:
    get:
      tags: [Runtime]
      summary: Get runtime configuration
      operationId: getConfig
      security:
        - UserTokenAuth: []
      responses:
        '200':
          description: Current runtime config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'
    put:
      tags: [Runtime]
      summary: Update runtime configuration
      operationId: updateConfig
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: Updated runtime config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /notification/token:
    put:
      tags: [Notification]
      summary: Register notification token for current user
      operationId: putNotificationToken
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTokenRequest'
      responses:
        '200':
          description: Token upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResult'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'
    delete:
      tags: [Notification]
      summary: Remove notification token for current user
      operationId: deleteNotificationToken
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTokenRequest'
      responses:
        '200':
          description: Token removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResult'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /notification/tokens:
    get:
      tags: [Notification]
      summary: List notification tokens for current user
      operationId: listNotificationTokens
      security:
        - UserTokenAuth: []
      responses:
        '200':
          description: Registered tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTokensResponse'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /notification/_test:
    post:
      tags: [Notification]
      summary: Send test notification to current user tokens
      operationId: sendNotificationTest
      security:
        - UserTokenAuth: []
      responses:
        '200':
          description: Test notification accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResult'
        '401':
          $ref: '#/components/responses/ErrorText'
        '409':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /tts:
    post:
      tags: [Speech]
      summary: Synthesize speech audio from text
      operationId: synthesizeTts
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: WAV audio bytes.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '502':
          $ref: '#/components/responses/ErrorText'
        '504':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /triggers:
    post:
      tags: [Improvement]
      summary: Trigger self-improvement workflow
      operationId: triggerImprovement
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImproveTriggerRequest'
      responses:
        '200':
          description: Trigger event recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImproveResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /proposals:
    post:
      tags: [Improvement]
      summary: Submit self-improvement proposal
      operationId: proposeImprovement
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImproveProposalRequest'
      responses:
        '200':
          description: Proposal recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImproveResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /reviews:
    post:
      tags: [Improvement]
      summary: Review and optionally apply proposal
      operationId: reviewImprovement
      security:
        - UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImproveReviewRequest'
      responses:
        '200':
          description: Review recorded (and maybe applied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImproveResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '404':
          $ref: '#/components/responses/ErrorText'
        '409':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /admin/thought-process/run:
    post:
      tags: [Admin]
      summary: Run thought process inspection
      operationId: adminRunThoughtProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThoughtProcessRunRequest'
      responses:
        '200':
          description: Thought process inspection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThoughtProcessRunResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /admin/thought-process/dry-run-events/commit:
    post:
      tags: [Admin]
      summary: Commit materialized events from a dry-run thought process
      operationId: adminCommitThoughtProcessDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThoughtProcessCommitDryRunRequest'
      responses:
        '200':
          description: Committed dry-run events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThoughtProcessCommitDryRunResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /admin/thought-process/event-history:
    post:
      tags: [Admin]
      summary: Preview the event history used as thought process input
      operationId: adminPreviewThoughtProcessEventHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThoughtProcessRunRequest'
      responses:
        '200':
          description: Event history preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThoughtProcessEventHistoryResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

  /admin/thought-process/components/{component}/run:
    post:
      tags: [Admin]
      summary: Run one thought process component with its typed input
      operationId: adminRunThoughtProcessComponent
      parameters:
        - name: component
          in: path
          required: true
          schema:
            type: string
            enum: [cognition, deliberation, decision, action_execution]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThoughtProcessComponentRunRequest'
      responses:
        '200':
          description: Component run result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThoughtProcessComponentRunResponse'
        '400':
          $ref: '#/components/responses/ErrorText'
        '401':
          $ref: '#/components/responses/ErrorText'
        '500':
          $ref: '#/components/responses/ErrorText'

components:
  securitySchemes:
    UserTokenAuth:
      type: apiKey
      in: header
      name: authorization
      description: |
        Required header format is `<user>:<WEB_AUTH_TOKEN>`.
        This is not Bearer format.

  responses:
    ErrorText:
      description: Plain-text error response body.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Event:
      type: object
      additionalProperties: false
      required:
        - event_id
        - ts
        - source
        - modality
        - payload
        - meta
      properties:
        event_id:
          type: string
        ts:
          type: string
          format: date-time
        source:
          type: string
        modality:
          type: string
        payload:
          type: object
          description: Event-specific JSON payload.
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/EventMeta'

    EventMeta:
      type: object
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    EventsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    RuntimeConfig:
      type: object
      additionalProperties: false
      required:
        - enableNotification
        - enableSensory
      properties:
        enableNotification:
          type: boolean
        enableSensory:
          type: boolean

    MetadataApiVersions:
      type: object
      additionalProperties: false
      required:
        - asyncapi
        - openapi
      properties:
        asyncapi:
          type: string
          nullable: true
        openapi:
          type: string
          nullable: true

    MetadataResponse:
      type: object
      additionalProperties: false
      required:
        - git_hash
        - openai_model
        - mcp_tools
        - api_versions
        - router_model
        - active_modules
      properties:
        git_hash:
          type: string
          nullable: true
        openai_model:
          type: string
        mcp_tools:
          type: array
          items:
            type: string
        api_versions:
          $ref: '#/components/schemas/MetadataApiVersions'
        router_model:
          type: string
        active_modules:
          type: array
          items:
            type: string

    NotificationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    NotificationResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean

    NotificationTokensResponse:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            type: string

    TtsRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    ImproveTriggerRequest:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: Default is `all` when omitted/blank.
        reason:
          type: string
          description: Default is `manual trigger` when omitted.

    ImproveProposalRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - job_id
        - diff_text
      properties:
        target:
          type: string
          description: One of `base|router|decision|submodule:<name>`.
        job_id:
          type: string
        diff_text:
          type: string
          description: Unified diff text.
        requires_approval:
          type: boolean
          description: If provided, must be true.
        created_by:
          type: string

    ImproveReviewRequest:
      type: object
      additionalProperties: false
      required:
        - proposal_id
        - job_id
        - target
        - decision
      properties:
        proposal_id:
          type: string
        job_id:
          type: string
        target:
          type: string
          description: Must match proposal target.
        decision:
          type: string
          description: "`approved` or `rejected`."
        reviewed_by:
          type: string
        review_reason:
          type: string

    ImproveResponse:
      type: object
      additionalProperties: false
      required:
        - proposal_id
        - review_event_id
        - apply_event_id
        - applied
      properties:
        proposal_id:
          type: string
          nullable: true
        review_event_id:
          type: string
          nullable: true
        apply_event_id:
          type: string
          nullable: true
        applied:
          type: boolean

    ThoughtProcessRunMode:
      type: string
      enum: [dry_run, commit]

    ThoughtProcessRunRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          type: string
          nullable: true
        history_limit:
          type: integer
          minimum: 0
          maximum: 1000
        history_cutoff_ts:
          type: string
          format: date-time
        exclude_event_ids:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/ThoughtProcessRunMode'

    ThoughtProcessRunResponse:
      type: object
      additionalProperties: false
      required: [mode, event_history, commit_events, result]
      properties:
        mode:
          $ref: '#/components/schemas/ThoughtProcessRunMode'
        event_history:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        commit_events:
          type: array
          description: Events that can be appended to adopt a dry-run result without rerunning it.
          items:
            $ref: '#/components/schemas/Event'
        result:
          $ref: '#/components/schemas/ThoughtProcessInspection'

    ThoughtProcessCommitDryRunRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Event'

    ThoughtProcessCommitDryRunResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    ThoughtProcessEventHistoryResponse:
      type: object
      additionalProperties: false
      required: [event_history]
      properties:
        event_history:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    ThoughtProcessInspection:
      type: object
      additionalProperties: false
      required:
        - decision_context
        - deliberation_contributions
        - decision_output
        - action_results
        - trace
      properties:
        decision_context:
          type: object
          additionalProperties: true
        deliberation_contributions:
          type: object
          additionalProperties: true
        decision_output:
          type: object
          additionalProperties: true
        action_results:
          type: array
          items:
            type: object
            additionalProperties: true
        trace:
          type: object
          additionalProperties: true

    ThoughtProcessComponentRunRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/ThoughtProcessRunMode'
        event_history:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        decision_context:
          type: object
          additionalProperties: true
        deliberation_contributions:
          type: object
          additionalProperties: true
        available_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        selected_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        action_context:
          type: object
          additionalProperties: true

    ThoughtProcessComponentRunResponse:
      type: object
      additionalProperties: false
      required: [component, mode, output, trace]
      properties:
        component:
          type: string
        mode:
          $ref: '#/components/schemas/ThoughtProcessRunMode'
        output:
          description: Component-specific typed output.
          nullable: true
        trace:
          type: array
          items:
            type: object
            additionalProperties: true
